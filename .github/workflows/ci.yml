name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app/app.js
      - run: node --check app/model-data.js
      - run: node --test app/tests/app.test.cjs

  certificates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy
      - run: python python/plate2_reconciliation_proof.py
      - run: python python/bi_topology_proof.py
      - run: python python/semimetal_semiconductor_proof.py
